
name: LeetCode → GitHub Sync

on:
  workflow_dispatch:

  schedule:
    # Runs every 15 minutes
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout GitHub repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 3. Install requests
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------------
      # 4. Sync LeetCode
      # ------------------------------------------------------------
      - name: Sync accepted LeetCode solutions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import time
          from pathlib import Path

          import requests


          # ============================================================
          # CONFIG
          # ============================================================

          GRAPHQL_URL = "https://leetcode.com/graphql"

          LEETCODE_SESSION = os.environ.get("LEETCODE_SESSION")

          if not LEETCODE_SESSION:
              print("ERROR: LEETCODE_SESSION secret is missing.")
              sys.exit(1)


          # ============================================================
          # SESSION
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept": "application/json",
              "Content-Type": "application/json",
              "Referer": "https://leetcode.com/",
              "Origin": "https://leetcode.com",
          })

          session.cookies.set(
              "LEETCODE_SESSION",
              LEETCODE_SESSION,
              domain=".leetcode.com"
          )


          # ============================================================
          # GRAPHQL HELPER
          # ============================================================

          def graphql(query, variables=None, operation_name=None):

              payload = {
                  "query": query,
                  "variables": variables or {}
              }

              if operation_name:
                  payload["operationName"] = operation_name

              response = session.post(
                  GRAPHQL_URL,
                  json=payload,
                  timeout=60
              )

              # Print useful error information
              if response.status_code != 200:
                  print()
                  print("LeetCode HTTP ERROR")
                  print("Status:", response.status_code)
                  print("Response:")
                  print(response.text[:5000])
                  print()
                  response.raise_for_status()

              try:
                  data = response.json()
              except Exception:
                  print("LeetCode returned non-JSON response:")
                  print(response.text[:5000])
                  raise

              if "errors" in data:
                  print()
                  print("LeetCode GraphQL ERROR:")
                  for error in data["errors"]:
                      print(error)
                  print()
                  raise RuntimeError("LeetCode GraphQL request failed.")

              return data.get("data", {})


          # ============================================================
          # 1. GET LOGGED-IN USERNAME
          # ============================================================

          USER_QUERY = """
          query globalData {
            userStatus {
              username
            }
          }
          """

          user_data = graphql(
              USER_QUERY,
              operation_name="globalData"
          )

          username = (
              user_data
              .get("userStatus", {})
              .get("username")
          )

          if not username:
              print("ERROR: Could not authenticate with LeetCode.")
              print("Your LEETCODE_SESSION may be expired.")
              sys.exit(1)

          print()
          print("=" * 60)
          print(f"Authenticated as: {username}")
          print("=" * 60)
          print()


          # ============================================================
          # 2. GET ACCEPTED SUBMISSIONS
          #
          # recentAcSubmissionList returns metadata:
          #
          # id
          # title
          # titleSlug
          # timestamp
          #
          # It does NOT reliably return source code.
          # ============================================================

          ACCEPTED_QUERY = """
          query recentAcSubmissions(
              $username: String!,
              $limit: Int!
          ) {
            recentAcSubmissionList(
              username: $username,
              limit: $limit
            ) {
              id
              title
              titleSlug
              timestamp
            }
          }
          """

          accepted_data = graphql(
              ACCEPTED_QUERY,
              variables={
                  "username": username,
                  "limit": 1000
              },
              operation_name="recentAcSubmissions"
          )

          submissions = accepted_data.get(
              "recentAcSubmissionList",
              []
          )

          if not submissions:
              print("No accepted submissions returned.")
              sys.exit(0)

          print(
              f"Accepted submissions returned: "
              f"{len(submissions)}"
          )


          # ============================================================
          # 3. LANGUAGE → FILE EXTENSION
          # ============================================================

          EXTENSIONS = {

              "python": "py",
              "python3": "py",

              "cpp": "cpp",
              "c++": "cpp",

              "java": "java",

              "javascript": "js",
              "typescript": "ts",

              "c": "c",

              "csharp": "cs",
              "c#": "cs",

              "kotlin": "kt",

              "swift": "swift",

              "go": "go",
              "golang": "go",

              "rust": "rs",

              "ruby": "rb",

              "php": "php",

              "scala": "scala",

              "dart": "dart",

              "racket": "rkt",

              "erlang": "erl",

              "elixir": "ex",

              "sql": "sql",

              "mysql": "sql",

              "mssql": "sql",

              "oracle": "sql",

              "postgresql": "sql",
          }


          # ============================================================
          # 4. SAFE DIRECTORY NAME
          # ============================================================

          def safe_slug(value):

              value = value.lower().strip()

              value = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  value
              )

              value = value.strip("-")

              return value


          # ============================================================
          # 5. FETCH SUBMISSION DETAILS
          #
          # LeetCode has changed these internal GraphQL fields over time.
          # We try the current submission-details operation first.
          # ============================================================

          SUBMISSION_DETAIL_QUERY = """
          query submissionDetails($submissionId: ID!) {
            submissionDetails(submissionId: $submissionId) {
              id
              code
              lang {
                name
              }
            }
          }
          """


          # ============================================================
          # 6. ALTERNATIVE DETAIL QUERY
          #
          # Some LeetCode deployments expose language as a string.
          # ============================================================

          SUBMISSION_DETAIL_QUERY_STRING_LANG = """
          query submissionDetails($submissionId: ID!) {
            submissionDetails(submissionId: $submissionId) {
              id
              code
              lang
            }
          }
          """


          # ============================================================
          # 7. DOWNLOAD EACH ACCEPTED SOLUTION
          # ============================================================

          added = 0
          skipped = 0
          failed = 0

          # Remove duplicate submission IDs
          unique_submissions = {}

          for submission in submissions:
              submission_id = str(
                  submission.get("id", "")
              )

              if submission_id:
                  unique_submissions[submission_id] = submission

          print(
              f"Unique accepted submissions: "
              f"{len(unique_submissions)}"
          )

          print()


          for index, (
              submission_id,
              submission
          ) in enumerate(
              unique_submissions.items(),
              start=1
          ):

              title = submission.get(
                  "title",
                  "unknown-problem"
              )

              title_slug = submission.get(
                  "titleSlug",
                  "unknown-problem"
              )

              print(
                  f"[{index}/{len(unique_submissions)}] "
                  f"{title} "
                  f"(submission {submission_id})"
              )


              # --------------------------------------------------------
              # Check whether this problem already exists.
              #
              # We don't immediately skip because the repository may
              # contain a solution in a different language.
              # --------------------------------------------------------

              problem_folder = Path(
                  safe_slug(title_slug)
              )


              # --------------------------------------------------------
              # Request source code
              # --------------------------------------------------------

              detail = None

              try:

                  detail_data = graphql(
                      SUBMISSION_DETAIL_QUERY,
                      variables={
                          "submissionId": submission_id
                      },
                      operation_name="submissionDetails"
                  )

                  detail = detail_data.get(
                      "submissionDetails"
                  )

              except Exception as first_error:

                  print(
                      "  First detail query failed; "
                      "trying alternate language format..."
                  )

                  try:

                      detail_data = graphql(
                          SUBMISSION_DETAIL_QUERY_STRING_LANG,
                          variables={
                              "submissionId": submission_id
                          },
                          operation_name="submissionDetails"
                      )

                      detail = detail_data.get(
                          "submissionDetails"
                      )

                  except Exception as second_error:

                      print(
                          f"  FAILED: {second_error}"
                      )

                      failed += 1
                      continue


              if not detail:

                  print(
                      "  No submission details returned."
                  )

                  failed += 1
                  continue


              code = detail.get("code")

              language = detail.get("lang")


              # --------------------------------------------------------
              # Normalize language
              # --------------------------------------------------------

              if isinstance(language, dict):
                  language = language.get("name")

              if language:
                  language = str(language).lower().strip()
              else:
                  language = ""


              if not code:

                  print(
                      "  No source code returned."
                  )

                  failed += 1
                  continue


              # --------------------------------------------------------
              # Find extension
              # --------------------------------------------------------

              extension = EXTENSIONS.get(
                  language
              )

              if not extension:

                  # Try some common variations
                  language_clean = (
                      language
                      .replace(" ", "")
                      .replace("-", "")
                      .replace("_", "")
                  )

                  extension = EXTENSIONS.get(
                      language_clean
                  )


              if not extension:

                  print(
                      f"  Unknown language: {language}"
                  )

                  failed += 1
                  continue


              # --------------------------------------------------------
              # Create problem directory
              # --------------------------------------------------------

              problem_folder.mkdir(
                  parents=True,
                  exist_ok=True
              )


              # --------------------------------------------------------
              # Filename
              #
              # Python:
              #     solution.py
              #
              # C++:
              #     solution.cpp
              #
              # Java:
              #     solution.java
              #
              # etc.
              # --------------------------------------------------------

              solution_file = (
                  problem_folder /
                  f"solution.{extension}"
              )


              # --------------------------------------------------------
              # DO NOT overwrite existing solution
              # --------------------------------------------------------

              if solution_file.exists():

                  print(
                      f"  Already exists: "
                      f"{solution_file}"
                  )

                  skipped += 1
                  continue


              # --------------------------------------------------------
              # Write source code
              # --------------------------------------------------------

              solution_file.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  f"  ADDED: {solution_file}"
              )

              added += 1


              # Be polite to LeetCode
              time.sleep(0.15)


          # ============================================================
          # SUMMARY
          # ============================================================

          print()
          print("=" * 60)
          print("SYNC COMPLETE")
          print("=" * 60)
          print(f"Added:   {added}")
          print(f"Skipped: {skipped}")
          print(f"Failed:  {failed}")
          print("=" * 60)


          # Do not fail the entire workflow merely because one old
          # submission could not be retrieved.
          #
          # Authentication/API errors above still fail normally.
          PY

      # ------------------------------------------------------------
      # 5. Commit new files
      # ------------------------------------------------------------
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No new solutions to commit."
            exit 0
          fi

          git commit -m "Sync LeetCode solutions"
          git push
