name: Sync LeetCode

on:
  workflow_dispatch:   # manual trigger (one-time full sync)
  schedule:
    - cron: "*/15 * * * *"   # auto-sync every 15 minutes

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync LeetCode submissions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependency
        run: |
          python -m pip install --disable-pip-version-check "requests==2.32.4"

      - name: Sync ALL LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSRFTOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}
        run: |
          python <<'PYTHON'
          import os, re, sys, time
          from pathlib import Path
          import requests

          GRAPHQL_URL = "https://leetcode.com/graphql/"
          ROOT = Path(os.environ["REPO_ROOT"]).resolve()
          SESSION = os.environ.get("LEETCODE_SESSION", "").strip()
          CSRF = os.environ.get("CSRFTOKEN", "").strip()

          if not SESSION or not CSRF:
              sys.exit("Missing LeetCode secrets")

          session = requests.Session()
          session.cookies.set("LEETCODE_SESSION", SESSION, domain=".leetcode.com")
          session.cookies.set("csrftoken", CSRF, domain=".leetcode.com")
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Content-Type": "application/json",
              "x-csrftoken": CSRF,
          })

          def graphql(query, variables=None, op=None):
              for attempt in range(5):
                  r = session.post(GRAPHQL_URL, json={"query":query,"variables":variables or {},"operationName":op}, timeout=30)
                  if r.status_code == 429: time.sleep(60); continue
                  r.raise_for_status()
                  body = r.json()
                  if "errors" in body: raise RuntimeError(body["errors"])
                  return body["data"]
              raise RuntimeError("GraphQL failed")

          def get_current_user():
              q = "query globalData { userStatus { isSignedIn username } }"
              data = graphql(q, op="globalData")
              if not data["userStatus"]["isSignedIn"]: sys.exit("Session expired")
              return data["userStatus"]["username"]

          def get_all_accepted_problems():
              q = """query problemsetQuestionList($limit:Int,$skip:Int,$filters:QuestionListFilterInput){
                problemsetQuestionList:questionList(limit:$limit,skip:$skip,filters:$filters){
                  total:totalNum questions:data{questionFrontendId title titleSlug difficulty status}
                }}"""
              problems, skip = [], 0
              while True:
                  data = graphql(q, {"limit":100,"skip":skip,"filters":{"status":"AC"}}, "problemsetQuestionList")
                  qs = data["problemsetQuestionList"]["questions"]
                  if not qs: break
                  problems.extend(qs)
                  skip += len(qs)
                  if skip >= data["problemsetQuestionList"]["total"]: break
              return problems

          def get_all_submissions(slug):
              q = """query submissions($offset:Int!,$limit:Int!,$lastKey:String,$questionSlug:String!){
                submissionList(offset:$offset,limit:$limit,lastKey:$lastKey,questionSlug:$questionSlug){
                  lastKey hasNext submissions{id statusDisplay lang timestamp}
                }}"""
              subs, offset, last_key = [], 0, None
              while True:
                  data = graphql(q, {"offset":offset,"limit":40,"lastKey":last_key,"questionSlug":slug}, "submissions")
                  result = data["submissionList"]
                  subs.extend([s for s in result["submissions"] if s["statusDisplay"].lower()=="accepted"])
                  if not result["hasNext"]: break
                  last_key, offset = result["lastKey"], offset+len(result["submissions"])
              return subs

          def get_submission_details(sub_id):
              q = """query submissionDetails($submissionId:Int!){
                submissionDetails(submissionId:$submissionId){
                  code lang{name verboseName} question{questionFrontendId title titleSlug difficulty}
                  runtimeDisplay memoryDisplay
                }}"""
              return graphql(q, {"submissionId":int(sub_id)}, "submissionDetails")["submissionDetails"]

          EXT = {"python":"py","cpp":"cpp","java":"java","javascript":"js","c":"c","c#":"cs","go":"go","rust":"rs","kotlin":"kt","swift":"swift","ruby":"rb","php":"php","scala":"scala","dart":"dart","r":"r","bash":"sh","mysql":"sql"}
          def ext(lang): return "."+EXT.get(lang.lower(),"txt")

          def slugify(v): return re.sub(r"[^a-z0-9]+","-",v.lower()).strip("-")

          def write(path, content):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")

          def make_readme(d):
              q = d["question"]; l = d["lang"]
              return f"# {q['questionFrontendId']}. {q['title']}\n\n- **Difficulty:** {q['difficulty']}\n- **Language:** {l.get('verboseName') or l.get('name')}\n- **Runtime:** {d.get('runtimeDisplay','N/A')}\n- **Memory:** {d.get('memoryDisplay','N/A')}\n- **LeetCode:** https://leetcode.com/problems/{q['titleSlug']}/\n"

          def main():
              print("LeetCode FULL SYNC")
              print("User:", get_current_user())
              problems = get_all_accepted_problems()
              print("Problems:", len(problems))
              for p in problems:
                  folder = ROOT / f"{int(p['questionFrontendId']):04d}-{slugify(p['title'])}"
                  subs = get_all_submissions(p["titleSlug"])
                  for s in subs:
                      d = get_submission_details(s["id"])
                      lang = d["lang"]["name"]
                      solution_file = folder / f"solution{ext(lang)}"
                      write(solution_file, d["code"])
                      readme_file = folder / "README.md"
                      if not readme_file.exists(): write(readme_file, make_readme(d))
                      print("Saved:", solution_file)

          if __name__=="__main__": main()
          PYTHON

      - name: Commit and push changes
        run: |
          git config user.name "adityaj143"
          git config user.email "adityaj143@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then echo "No changes"; exit 0; fi
          git add -A
          git commit -m "[LeetCode Sync] Update submissions"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
