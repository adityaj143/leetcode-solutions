name: LeetCode Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          import urllib.error

          SESSION = os.environ["LEETCODE_SESSION"]
          CSRF = os.environ["LEETCODE_CSRF_TOKEN"]

          GRAPHQL_URL = "https://leetcode.com/graphql"

          headers = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0",
              "Referer": "https://leetcode.com/",
              "x-csrftoken": CSRF,
              "Cookie": f"LEETCODE_SESSION={SESSION}; csrftoken={CSRF}",
          }

          def graphql(query, variables):
              payload = json.dumps({
                  "query": query,
                  "variables": variables
              }).encode()

              request = urllib.request.Request(
                  GRAPHQL_URL,
                  data=payload,
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode())
              except urllib.error.HTTPError as e:
                  print(f"LeetCode HTTP error: {e.code}")
                  raise

          query = """
          query recentAcSubmissions($username: String!, $limit: Int!) {
              recentAcSubmissionList(username: $username, limit: $limit) {
                  id
                  title
                  titleSlug
                  timestamp
              }
          }
          """

          viewer_query = """
          query {
              userStatus {
                  username
              }
          }
          """

          viewer_response = graphql(viewer_query, {})

          if "errors" in viewer_response:
              print("LeetCode authentication failed.")
              print(json.dumps(viewer_response["errors"], indent=2))
              raise SystemExit(1)

          user_status = viewer_response.get("data", {}).get("userStatus")

          if not user_status or not user_status.get("username"):
              print("Unable to determine the authenticated LeetCode user.")
              raise SystemExit(1)

          username = user_status["username"]

          print(f"Authenticated as: {username}")

          response = graphql(
              query,
              {
                  "username": username,
                  "limit": 20
              }
          )

          if "errors" in response:
              print("LeetCode returned GraphQL errors:")
              print(json.dumps(response["errors"], indent=2))
              raise SystemExit(1)

          submissions = (
              response
              .get("data", {})
              .get("recentAcSubmissionList")
          )

          if submissions is None:
              print("No recent accepted submissions returned.")
              print(json.dumps(response, indent=2))
              raise SystemExit(0)

          if not isinstance(submissions, list):
              print("Unexpected LeetCode response format.")
              print(json.dumps(response, indent=2))
              raise SystemExit(1)

          if not submissions:
              print("No new accepted submissions found.")
              raise SystemExit(0)

          print(f"Found {len(submissions)} recent accepted submission(s).")

          changed = False

          for submission in reversed(submissions):
              title = submission.get("title", "")
              slug = submission.get("titleSlug", "")
              submission_id = submission.get("id", "")
              timestamp = submission.get("timestamp", "")

              if not slug:
                  continue

              print(
                  f"Found: {title} | "
                  f"slug={slug} | "
                  f"id={submission_id} | "
                  f"timestamp={timestamp}"
              )

              print(
                  "Submission metadata retrieved successfully. "
                  "Source-code synchronization requires an additional "
                  "authenticated submission-details request."
              )

          if changed:
              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "41898282+github-actions[bot]@users.noreply.github.com"
                  ],
                  check=True
              )

              subprocess.run(["git", "add", "."], check=True)

              result = subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Sync LeetCode submission"
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode == 0:
                  subprocess.run(
                      ["git", "push"],
                      check=True
                  )

                  print("Changes pushed successfully.")
              else:
                  print("Nothing new to commit.")

          PY
