name: LeetCode Sync

on:
  workflow_dispatch:

  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync LeetCode solutions
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}

          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}

          # Keep the files in the root of your repository
          destination-folder: .

          # Add problem number, runtime and memory information
          verbose: true

          # Important:
          # This matches the commit name used by this workflow.
          commit-header: "Sync LeetCode submission"

          # Ignore duplicate accepted submissions for
          # the same problem/language within 24 hours.
          filter-duplicate-secs: 86400
